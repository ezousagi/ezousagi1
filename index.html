<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>年末おみくじ - 今年もおつかれさま</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Zen Maru Gothic', sans-serif;
        background-color: #fdfbf7;
        margin: 0;
      }
      #root:empty::before {
        content: "アプリを起動中...";
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        color: #999;
        font-size: 0.9rem;
      }
      #error-console {
        position: fixed;
        bottom: 0;
        left: 0;
        width: 100%;
        max-height: 150px;
        overflow-y: auto;
        background: rgba(0,0,0,0.9);
        color: #ff5f5f;
        padding: 10px;
        font-family: monospace;
        font-size: 11px;
        display: none;
        z-index: 10000;
        white-space: pre-wrap;
        border-top: 2px solid #ff5f5f;
      }
    </style>
    
    <script>
      window.onerror = function(msg, url, line, col, error) {
        var log = document.getElementById('error-console');
        if (log) {
          log.style.display = 'block';
          log.textContent += '\n[' + new Date().toLocaleTimeString() + '] ' + msg + (url ? '\n  at ' + url + ':' + line : '');
        }
        return false;
      };
    </script>

    <script type="importmap">

  "imports": {
    "react": "https://esm.sh/react@19.0.0",
    "react-dom": "https://esm.sh/react-dom@19.0.0",

    "lucide-react": "https://esm.sh/lucide-react@0.460.0?external=react",
    "framer-motion": "https://esm.sh/framer-motion@11.11.11?external=react",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/"
  }
}
</script>

    <!-- esm.sh loader -->
    <script type="module" src="https://esm.sh/run" crossorigin></script>
  </head>
  <body>
    <div id="root"></div>
    <div id="error-console">--- エラーログ ---</div>
    
    <!-- エントリポイント -->
    <script type="text/tsx" src="./index.tsx"></script>
  </body>
</html>
